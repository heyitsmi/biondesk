<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Biondesk</title>
    <meta name="description" content="The page you are looking for does not exist.">
    
    <!-- Google Fonts: Google Sans Flex -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Config & Styles -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Google Sans Flex', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#F8FAFC',
                            100: '#F1F5F9',
                            900: '#0F172A',
                            accent: '#4F46E5', // Indigo
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Reset & Typography Details */
        body {
            font-feature-settings: "cv11", "ss01";
            -webkit-font-smoothing: antialiased;
            background-color: #FAFAFA;
            color: #0F172A;
            overflow-x: hidden;
        }

        /* Framer-style Noise Background */
        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="selection:bg-slate-900 selection:text-white flex flex-col min-h-screen">

    <div class="bg-noise"></div>

    <!-- NAVIGATION (Consistent) -->
    <nav class="fixed top-0 w-full z-50 transition-all duration-300 border-b border-transparent" id="navbar">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <a href="index.html" class="text-xl font-bold tracking-tight flex items-center gap-2">
                    <div class="w-6 h-6 bg-slate-900 rounded-md flex items-center justify-center text-white">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg>
                    </div>
                    Biondesk
                </a>

                <!-- Desktop Links -->
                <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
                    <a href="index.html#features" class="hover:text-slate-900 transition-colors">Features</a>
                    <a href="index.html#pricing" class="hover:text-slate-900 transition-colors">Pricing</a>
                    <a href="about.html" class="hover:text-slate-900 transition-colors">About</a>
                </div>

                <!-- CTA -->
                <div class="flex items-center gap-4">
                    <a href="#" class="hidden md:block text-sm font-medium text-slate-900 hover:text-slate-600">Log in</a>
                    <a href="#" class="bg-slate-900 text-white text-sm font-medium px-5 py-2.5 rounded-full hover:bg-slate-800 transition-all hover:scale-105 active:scale-95 shadow-lg shadow-slate-900/10">
                        Start your desk
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-grow flex items-center justify-center pt-20 pb-20 relative overflow-hidden">
        
        <!-- Decor gradient (Subtle background glow) -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[500px] bg-indigo-50/50 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

        <div class="text-center px-6">
            <!-- Visual Element (Empty Desk Icon) -->
            <div class="mb-8 relative inline-block animate-float">
                <div class="w-24 h-24 bg-white rounded-3xl border border-slate-200 shadow-xl flex items-center justify-center text-slate-300 relative z-10">
                    <i data-lucide="search-x" class="w-10 h-10"></i>
                </div>
                <!-- Floating elements for visual interest -->
                <div class="absolute -top-4 -right-4 w-12 h-12 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-center animate-bounce delay-100">
                    <span class="text-xl font-bold text-slate-400">?</span>
                </div>
                <div class="absolute -bottom-2 -left-4 w-12 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white animate-pulse delay-700 shadow-lg">
                    <span class="text-xs font-bold">404</span>
                </div>
            </div>

            <h1 class="text-4xl md:text-6xl font-bold tracking-tight text-slate-900 mb-6">Desk not found.</h1>
            <p class="text-lg text-slate-600 mb-10 max-w-md mx-auto leading-relaxed">
                The page you are looking for might have been moved, deleted, or simply doesn't exist. Let's get you back to work.
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="index.html" class="bg-slate-900 text-white px-8 py-3.5 rounded-xl font-semibold hover:bg-slate-800 transition-all hover:-translate-y-1 shadow-lg shadow-slate-900/10 flex items-center gap-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Back to Home
                </a>
                <!-- Updated to point to support.html -->
                <a href="support.html" class="text-slate-600 font-medium px-6 py-3.5 rounded-xl hover:bg-slate-100 transition-colors border border-transparent hover:border-slate-200">
                    Contact Support
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER (Simplified for 404) -->
    <footer class="border-t border-slate-200 py-8 bg-white mt-auto">
        <div class="max-w-7xl mx-auto px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-sm text-slate-400">
                &copy; 2024 Biondesk Inc.
            </div>
            <div class="flex gap-6 text-sm text-slate-400">
                <a href="index.html" class="hover:text-slate-900 transition-colors">Home</a>
                <a href="#" class="hover:text-slate-900 transition-colors">Status</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script>
        // Icons
        lucide.createIcons();

        // Navbar Blur Effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                navbar.classList.add('bg-white/80', 'backdrop-blur-md', 'border-slate-200/50');
                navbar.classList.remove('border-transparent');
            } else {
                navbar.classList.remove('bg-white/80', 'backdrop-blur-md', 'border-slate-200/50');
                navbar.classList.add('border-transparent');
            }
        });
    </script>
</body>
</html>
