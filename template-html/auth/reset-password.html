<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Dealis Workspace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Sans Flex -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Google Sans Flex"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        indigo: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 800: '#1e293b', 900: '#0f172a' },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white font-sans antialiased h-screen flex overflow-hidden">

    <!-- LEFT: Visual & Branding (Hidden on Mobile) -->
    <div class="hidden lg:flex w-1/2 bg-slate-900 relative items-center justify-center overflow-hidden">
        <!-- Abstract Background -->
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/50 to-slate-900 z-10"></div>
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-600 rounded-full blur-[120px] opacity-40"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-indigo-500 rounded-full blur-[150px] opacity-20"></div>
        
        <!-- Content -->
        <div class="relative z-20 text-center px-12">
            <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-8 border border-white/20 shadow-xl">
                <i class="ph-bold ph-lock-key-open text-3xl text-white"></i>
            </div>
            <h2 class="text-4xl font-bold text-white mb-4 tracking-tight">Secure your<br>account.</h2>
            <p class="text-indigo-200 text-lg leading-relaxed max-w-md mx-auto">
                Create a strong new password to get back to managing your freelance business safely.
            </p>
        </div>
    </div>

    <!-- RIGHT: Reset Password Form -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-8 lg:p-12 relative">
        <div class="w-full max-w-sm animate-fade-in">
            
            <!-- Mobile Logo -->
            <div class="lg:hidden mb-8 flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                    <i class="ph-bold ph-lightning text-lg"></i>
                </div>
                <span class="text-xl font-bold text-slate-900">Dealis.</span>
            </div>

            <div class="mb-8">
                <h1 class="text-2xl font-[700] text-slate-900 mb-2">Set new password</h1>
                <p class="text-sm text-slate-500">Your new password must be different from previous used passwords.</p>
            </div>

            <form class="space-y-5" onsubmit="event.preventDefault(); alert('Password updated successfully!'); window.location.href='login.html';">
                
                <!-- New Password -->
                <div class="space-y-1.5">
                    <label class="text-sm font-[600] text-slate-700">New Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" placeholder="Min. 8 characters" class="w-full pl-10 pr-10 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400" id="newPassword">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" onclick="togglePassword('newPassword', this)">
                            <i class="ph ph-eye-slash text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-1.5">
                    <label class="text-sm font-[600] text-slate-700">Confirm Password</label>
                    <div class="relative">
                        <i class="ph ph-check-circle absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" placeholder="Re-enter password" class="w-full pl-10 pr-10 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400" id="confirmPassword">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" onclick="togglePassword('confirmPassword', this)">
                            <i class="ph ph-eye-slash text-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <p class="text-xs text-slate-400 mb-4">
                        <i class="ph-fill ph-info mr-1 text-indigo-500"></i>
                        Must be at least 8 characters.
                    </p>
                    <!-- Submit -->
                    <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-[600] shadow-lg shadow-slate-200/50 transition-all transform active:scale-[0.98]">
                        Reset Password
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center">
                <a href="login.html" class="inline-flex items-center gap-2 text-sm font-[600] text-slate-500 hover:text-slate-800 transition-colors">
                    <i class="ph-bold ph-arrow-left"></i>
                    Back to Sign in
                </a>
            </div>

        </div>
        
        <!-- Footer -->
        <div class="absolute bottom-6 text-center w-full">
            <p class="text-[10px] text-slate-300">© 2026 Dealis Workspace. Crafted for growth.</p>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            } else {
                input.type = "password";
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            }
        }
    </script>

</body>
</html>
